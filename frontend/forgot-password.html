<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - lmtiCore</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" sizes="32x32" href="Favicon.png">
    <style>
        .auth-container{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f172a,#1e293b);position:relative;overflow:hidden;}
        .auth-container::before{content:'';position:absolute;width:500px;height:500px;background:radial-gradient(circle,rgba(139,92,246,0.1),transparent 70%);top:-100px;right:-100px;}
        .auth-container::after{content:'';position:absolute;width:400px;height:400px;background:radial-gradient(circle,rgba(6,182,212,0.1),transparent 70%);bottom:-100px;left:-100px;}
        .auth-card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:16px;padding:48px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,0.3);position:relative;z-index:1;}
        .error-box{background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.3);color:#ef4444;padding:12px 16px;border-radius:8px;margin-bottom:16px;font-size:13px;display:none;}
        .error-box.show{display:block;}
        .success-box{background:rgba(16,185,129,0.08);border:1px solid rgba(16,185,129,0.3);color:#10b981;padding:12px 16px;border-radius:8px;margin-bottom:16px;font-size:13px;display:none;}
        .success-box.show{display:block;}
        .step{display:none;}.step.active{display:block;}
        .otp-inputs{display:flex;gap:10px;justify-content:center;margin:20px 0;}
        .otp-inputs input{width:50px;height:56px;text-align:center;font-size:22px;font-weight:700;background:#0b0f1a;border:2px solid var(--border-color);border-radius:10px;color:white;outline:none;transition:0.2s;}
        .otp-inputs input:focus{border-color:var(--accent-primary);}
        .step-indicator{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:28px;}
        .step-dot{width:10px;height:10px;border-radius:50%;background:var(--border-color);transition:0.3s;}
        .step-dot.active{background:var(--accent-primary);width:24px;border-radius:5px;}
        .pwd-strength{height:4px;border-radius:2px;margin-top:8px;background:var(--bg-secondary);overflow:hidden;display:none;}
        .pwd-strength-bar{height:100%;border-radius:2px;transition:width .3s,background .3s;}
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div style="text-align:center;margin-bottom:24px;">
                <div style="width:64px;height:64px;background:linear-gradient(135deg,#f59e0b,#ef4444);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;box-shadow:0 8px 24px rgba(245,158,11,0.3);">
                    <i class="fas fa-lock" style="font-size:26px;color:white;"></i>
                </div>
                <h1 style="font-size:24px;font-weight:700;margin-bottom:6px;">Forgot Password</h1>
                <p style="font-size:14px;color:var(--text-muted);">Reset your account password</p>
            </div>
            <div class="step-indicator">
                <div class="step-dot active" id="dot1"></div>
                <div class="step-dot" id="dot2"></div>
                <div class="step-dot" id="dot3"></div>
            </div>
            <div id="error-box" class="error-box"></div>
            <div id="success-box" class="success-box"></div>

            <!-- Step 1: Email -->
            <div class="step active" id="step1">
                <p style="font-size:13px;color:var(--text-muted);margin-bottom:20px;text-align:center;">Enter your email address and we'll send you a verification code.</p>
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" id="reset-email" class="form-input" placeholder="you@organization.com">
                </div>
                <button onclick="sendResetOTP()" class="btn btn-primary" style="width:100%;padding:14px;font-size:15px;">
                    <i class="fas fa-paper-plane"></i> Send Verification Code
                </button>
                <div style="text-align:center;margin-top:20px;">
                    <a href="login.html" style="color:var(--text-muted);text-decoration:none;font-size:13px;display:inline-flex;align-items:center;gap:6px;">
                        <i class="fas fa-arrow-left"></i> Back to Login
                    </a>
                </div>
            </div>

            <!-- Step 2: OTP -->
            <div class="step" id="step2">
                <div style="text-align:center;margin-bottom:20px;">
                    <div style="width:56px;height:56px;background:rgba(6,182,212,0.1);border:2px solid rgba(6,182,212,0.3);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;">
                        <i class="fas fa-envelope" style="color:var(--accent-primary);font-size:22px;"></i>
                    </div>
                    <h3 style="font-size:18px;font-weight:700;margin-bottom:6px;">Check Your Email</h3>
                    <p style="font-size:13px;color:var(--text-muted);">We sent a 6-digit code to<br><strong id="otp-email-display" style="color:var(--accent-primary)"></strong></p>
                </div>
                <div class="otp-inputs">
                    <input type="text" maxlength="1" class="otp-digit" id="otp1">
                    <input type="text" maxlength="1" class="otp-digit" id="otp2">
                    <input type="text" maxlength="1" class="otp-digit" id="otp3">
                    <input type="text" maxlength="1" class="otp-digit" id="otp4">
                    <input type="text" maxlength="1" class="otp-digit" id="otp5">
                    <input type="text" maxlength="1" class="otp-digit" id="otp6">
                </div>
                <button onclick="verifyResetOTP()" class="btn btn-primary" style="width:100%;padding:14px;font-size:15px;">
                    <i class="fas fa-check"></i> Verify Code
                </button>
                <div style="text-align:center;margin-top:16px;font-size:13px;color:var(--text-muted);">
                    Didn't receive it? <a href="#" onclick="sendResetOTP()" style="color:var(--accent-primary);text-decoration:none;font-weight:600;">Resend</a>
                </div>
            </div>

            <!-- Step 3: New Password -->
            <div class="step" id="step3">
                <p style="font-size:13px;color:var(--text-muted);margin-bottom:20px;text-align:center;">Enter your new password below.</p>
                <div class="form-group">
                    <label class="form-label">New Password</label>
                    <input type="password" id="new-password" class="form-input" placeholder="Min 8 chars" oninput="checkStrength(this.value)">
                    <div class="pwd-strength" id="pwd-strength"><div class="pwd-strength-bar" id="pwd-bar"></div></div>
                    <div id="pwd-hint" style="font-size:11px;margin-top:4px;display:none;"></div>
                </div>
                <div class="form-group">
                    <label class="form-label">Confirm New Password</label>
                    <input type="password" id="confirm-password" class="form-input" placeholder="Repeat new password">
                </div>
                <button onclick="resetPassword()" class="btn btn-primary" style="width:100%;padding:14px;font-size:15px;background:linear-gradient(135deg,#f59e0b,#ef4444);">
                    <i class="fas fa-key"></i> Reset Password
                </button>
            </div>
        </div>
    </div>
    <div id="loader" class="loader"><div class="spinner"></div></div>
    <script>
        const API = 'https://gradproject2026-production-821d.up.railway.app';
        let verifiedEmail = null;

        function showError(msg) {
            const el = document.getElementById('error-box');
            el.textContent = msg; el.classList.add('show');
            document.getElementById('success-box').classList.remove('show');
        }
        function showSuccess(msg) {
            const el = document.getElementById('success-box');
            el.textContent = msg; el.classList.add('show');
            document.getElementById('error-box').classList.remove('show');
        }
        function goToStep(n) {
            document.querySelectorAll('.step').forEach((s,i) => s.classList.toggle('active', i===n-1));
            document.querySelectorAll('.step-dot').forEach((d,i) => d.classList.toggle('active', i===n-1));
            document.getElementById('error-box').classList.remove('show');
            document.getElementById('success-box').classList.remove('show');
        }

        async function sendResetOTP() {
            const email = document.getElementById('reset-email').value.trim();
            if (!email) { showError('Please enter your email.'); return; }
            const loader = document.getElementById('loader');
            loader.classList.add('active');
            try {
                const res = await fetch(`${API}/api/auth/send-otp`, {
                    method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ email, purpose: 'reset' })
                });
                const result = await res.json();
                if (res.ok) {
                    verifiedEmail = email;
                    document.getElementById('otp-email-display').textContent = email;
                    goToStep(2);
                    setupOTPInputs();
                } else {
                    showError(result.detail || 'Email not found.');
                }
            } catch(e) { showError('Connection failed.'); }
            finally { loader.classList.remove('active'); }
        }

        async function verifyResetOTP() {
            const otp = Array.from(document.querySelectorAll('.otp-digit')).map(i => i.value).join('');
            if (otp.length < 6) { showError('Please enter the complete 6-digit code.'); return; }
            const loader = document.getElementById('loader');
            loader.classList.add('active');
            try {
                const res = await fetch(`${API}/api/auth/verify-otp`, {
                    method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ email: verifiedEmail, otp })
                });
                const result = await res.json();
                if (res.ok && result.verified) {
                    goToStep(3);
                } else {
                    showError(result.detail || 'Invalid code.');
                }
            } catch(e) { showError('Verification failed.'); }
            finally { loader.classList.remove('active'); }
        }

        async function resetPassword() {
            const newPwd = document.getElementById('new-password').value;
            const confirm = document.getElementById('confirm-password').value;
            if (!newPwd || !confirm) { showError('Please fill all fields.'); return; }
            if (newPwd !== confirm) { showError('Passwords do not match.'); return; }
            const loader = document.getElementById('loader');
            loader.classList.add('active');
            try {
                const res = await fetch(`${API}/api/auth/reset-password`, {
                    method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ email: verifiedEmail, new_password: newPwd })
                });
                const result = await res.json();
                if (res.ok) {
                    showSuccess('Password reset successfully! Redirecting to login...');
                    setTimeout(() => window.location.href = 'login.html', 2000);
                } else {
                    showError(result.detail || 'Failed to reset password.');
                }
            } catch(e) { showError('Connection failed.'); }
            finally { loader.classList.remove('active'); }
        }

        function setupOTPInputs() {
            const inputs = document.querySelectorAll('.otp-digit');
            inputs.forEach((input, i) => {
                input.value = '';
                input.addEventListener('input', () => { if (input.value && i < inputs.length - 1) inputs[i+1].focus(); });
                input.addEventListener('keydown', (e) => { if (e.key === 'Backspace' && !input.value && i > 0) inputs[i-1].focus(); });
            });
            inputs[0].focus();
        }

        function checkStrength(val) {
            const bar = document.getElementById('pwd-bar');
            const hint = document.getElementById('pwd-hint');
            const strength = document.getElementById('pwd-strength');
            if (!val) { strength.style.display='none'; hint.style.display='none'; return; }
            strength.style.display='block'; hint.style.display='block';
            let score = 0;
            if (val.length >= 8) score++;
            if (/[A-Z]/.test(val)) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[@$!%*?&#]/.test(val)) score++;
            const levels = [{w:'25%',c:'#ef4444',t:'Weak'},{w:'50%',c:'#f59e0b',t:'Fair'},{w:'75%',c:'#06b6d4',t:'Good'},{w:'100%',c:'#10b981',t:'Strong'}];
            const l = levels[Math.max(0,score-1)];
            bar.style.width=l.w; bar.style.background=l.c;
            hint.textContent=l.t; hint.style.color=l.c;
        }
    </script>
</body>
</html>
