<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Control Audit - lmtiCore</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" sizes="32x32" href="Favicon.png">
    <style>
        .audit-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }
        .progress-stepper {
            height: 8px;
            background: var(--bg-secondary);
            border-radius: 10px;
            margin: 25px 0;
            overflow: hidden;
        }
        #audit-progress {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            width: 0%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .question-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .answer-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-top: 40px;
        }
        .btn-answer {
            padding: 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: 1px solid var(--border-color);
            background: rgba(255,255,255,0.05);
            color: var(--text-primary);
        }
        .btn-answer:hover {
            transform: translateY(-3px);
            background: var(--bg-secondary);
            border-color: var(--accent-primary);
        }
        .btn-compliant:hover { border-color: #10b981; color: #10b981; }
        .btn-non-compliant:hover { border-color: #ef4444; color: #ef4444; }
        
        .hint-box {
            background: rgba(6, 182, 212, 0.05);
            border-left: 4px solid var(--accent-primary);
            padding: 15px;
            margin-top: 20px;
            font-size: 14px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <main class="main-content" style="margin-left: 0;"> <div class="audit-container">
                <div id="audit-session">
                    <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                        <div>
                            <span id="question-category" class="badge badge-primary" style="margin-bottom: 8px; display: inline-block;">LOADING...</span>
                            <h1 style="font-size: 32px; margin: 0;">AI Control Audit</h1>
                        </div>
                        <div id="question-number" style="color: var(--text-muted); font-weight: 500;">Question 0 of 0</div>
                    </div>

                    <div class="progress-stepper">
                        <div id="audit-progress"></div>
                    </div>

                    <div class="question-card">
                        <h2 id="question-text" style="line-height: 1.5; margin-bottom: 20px;">
                            <i class="fas fa-spinner fa-spin"></i> Analyzing control requirements...
                        </h2>
                        
                        <div id="evidence-hint" class="hint-box">
                            </div>

                        <div class="answer-grid">
                            <button onclick="submitAnswer('Compliant')" class="btn-answer btn-compliant">
                                <i class="fas fa-check-circle"></i> Compliant
                            </button>
                            <button onclick="submitAnswer('Non-Compliant')" class="btn-answer btn-non-compliant">
                                <i class="fas fa-times-circle"></i> Non-Compliant
                            </button>
                            <button onclick="submitAnswer('Partial')" class="btn-answer">
                                <i class="fas fa-adjust"></i> Partial Compliance
                            </button>
                            <button onclick="submitAnswer('N/A')" class="btn-answer">
                                <i class="fas fa-ban"></i> Not Applicable
                            </button>
                        </div>
                        
                        <div style="margin-top: 30px; text-align: center;">
                            <p style="font-size: 12px; color: var(--text-muted);">
                                Tip: You can use keys 1, 2, 3, or 4 on your keyboard to answer quickly.
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="loader" class="loader">
        <div class="spinner"></div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/audit.js"></script>
</body>
</html>
