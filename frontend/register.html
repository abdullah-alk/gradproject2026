<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - lmtiCore</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .register-container{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f172a,#1e293b);position:relative;overflow:hidden;}
        .register-container::before{content:'';position:absolute;width:500px;height:500px;background:radial-gradient(circle,rgba(139,92,246,0.1),transparent 70%);top:-100px;right:-100px;}
        .register-container::after{content:'';position:absolute;width:400px;height:400px;background:radial-gradient(circle,rgba(6,182,212,0.1),transparent 70%);bottom:-100px;left:-100px;}
        .register-card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:16px;padding:48px;width:100%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,0.3);position:relative;z-index:1;}
        .register-logo{width:64px;height:64px;background:linear-gradient(135deg,var(--accent-secondary),var(--accent-primary));border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;box-shadow:0 8px 24px rgba(139,92,246,0.3);}
        .error-box{background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.3);color:#ef4444;padding:12px 16px;border-radius:8px;margin-bottom:16px;font-size:13px;display:none;}
        .error-box.show{display:block;}
        .success-box{background:rgba(16,185,129,0.08);border:1px solid rgba(16,185,129,0.3);color:#10b981;padding:12px 16px;border-radius:8px;margin-bottom:16px;font-size:13px;display:none;}
        .success-box.show{display:block;}
        .step{display:none;}.step.active{display:block;}
        .otp-inputs{display:flex;gap:10px;justify-content:center;margin:20px 0;}
        .otp-inputs input{width:50px;height:56px;text-align:center;font-size:22px;font-weight:700;background:#0b0f1a;border:2px solid var(--border-color);border-radius:10px;color:white;outline:none;transition:0.2s;}
        .otp-inputs input:focus{border-color:var(--accent-primary);}
        .step-indicator{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:28px;}
        .step-dot{width:10px;height:10px;border-radius:50%;background:var(--border-color);transition:0.3s;}
        .step-dot.active{background:var(--accent-primary);width:24px;border-radius:5px;}
        .field-error{color:#ef4444;font-size:12px;margin-top:4px;display:flex;align-items:center;gap:4px;}
        .field-success{color:#10b981;font-size:12px;margin-top:4px;display:flex;align-items:center;gap:4px;}
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-card">
            <div style="text-align:center;margin-bottom:24px;">
                <div class="register-logo"><i class="fas fa-user-plus" style="font-size:26px;color:white;"></i></div>
                <h1 style="font-size:26px;font-weight:700;margin-bottom:6px;">Create Account</h1>
                <p style="font-size:14px;color:var(--text-muted);">Join lmtiCore Platform</p>
            </div>
            <div class="step-indicator">
                <div class="step-dot active" id="dot1"></div>
                <div class="step-dot" id="dot2"></div>
            </div>
            <div id="error-box" class="error-box"></div>
            <div id="success-box" class="success-box"></div>
            <div class="step active" id="step1">
                <a href="landing.html" style="display:inline-flex;align-items:center;gap:6px;color:var(--text-muted);text-decoration:none;font-size:13px;margin-bottom:20px">
                    <i class="fas fa-arrow-left"></i> Back to Home
                </a>
                <form id="registerForm">
                    <div class="form-group">
                        <label class="form-label">Full Name</label>
                        <input type="text" id="full_name" class="form-input" placeholder="e.g. Mohammed Al-Rashidi" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Username</label>
                        <input type="text" id="username" class="form-input" placeholder="e.g. m.rashidi" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <input type="email" id="email" class="form-input" placeholder="you@organization.com" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" id="password" class="form-input" placeholder="Minimum 8 characters" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width:100%;padding:14px;font-size:15px;background:var(--accent-secondary);">
                        <i class="fas fa-user-plus"></i> Create Account
                    </button>
                </form>
                <div style="text-align:center;margin-top:24px;font-size:13px;color:var(--text-muted);">
                    Already have an account? <a href="login.html" style="color:var(--accent-primary);text-decoration:none;font-weight:600;">Sign In</a>
                </div>
            </div>
            <div class="step" id="step2">
                <div style="text-align:center;margin-bottom:20px;">
                    <div style="width:56px;height:56px;background:rgba(6,182,212,0.1);border:2px solid rgba(6,182,212,0.3);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;">
                        <i class="fas fa-envelope" style="color:var(--accent-primary);font-size:22px;"></i>
                    </div>
                    <h3 style="font-size:18px;font-weight:700;margin-bottom:6px;">Verify Your Email</h3>
                    <p style="font-size:13px;color:var(--text-muted);">We sent a 6-digit code to<br><strong id="otp-email-display" style="color:var(--accent-primary)"></strong></p>
                </div>
                <div class="otp-inputs">
                    <input type="text" maxlength="1" class="otp-digit" id="otp1">
                    <input type="text" maxlength="1" class="otp-digit" id="otp2">
                    <input type="text" maxlength="1" class="otp-digit" id="otp3">
                    <input type="text" maxlength="1" class="otp-digit" id="otp4">
                    <input type="text" maxlength="1" class="otp-digit" id="otp5">
                    <input type="text" maxlength="1" class="otp-digit" id="otp6">
                </div>
                <button onclick="verifyOTP()" class="btn btn-primary" style="width:100%;padding:14px;font-size:15px;margin-top:8px;">
                    <i class="fas fa-check-circle"></i> Verify & Complete Registration
                </button>
                <div style="text-align:center;margin-top:16px;font-size:13px;color:var(--text-muted);">
                    Didn't receive the code? <a href="#" onclick="resendOTP()" style="color:var(--accent-primary);text-decoration:none;font-weight:600;">Resend</a>
                </div>
            </div>
        </div>
    </div>
    <div id="loader" class="loader"><div class="spinner"></div></div>
    <script src="js/api.js"></script>
    <script>
        if (localStorage.getItem('authToken')) window.location.href = 'index.html';
        const API = 'https://gradproject2026-production-821d.up.railway.app';
        let pendingData = null;

        function showError(msg) {
            const el = document.getElementById('error-box');
            el.innerHTML = '<i class="fas fa-exclamation-circle" style="margin-right:6px"></i>' + msg;
            el.classList.add('show');
            document.getElementById('success-box').classList.remove('show');
        }
        function showSuccess(msg) {
            const el = document.getElementById('success-box');
            el.textContent = msg; el.classList.add('show');
            document.getElementById('error-box').classList.remove('show');
        }
        function goToStep(n) {
            document.querySelectorAll('.step').forEach((s,i) => s.classList.toggle('active', i===n-1));
            document.querySelectorAll('.step-dot').forEach((d,i) => d.classList.toggle('active', i===n-1));
            document.getElementById('error-box').classList.remove('show');
            document.getElementById('success-box').classList.remove('show');
        }

        // ── Validation functions ──
        function validateFullName(v) {
            if (!v) return 'Full name is required.';
            if (v.length < 2) return 'Name must be at least 2 characters.';
            return '';
        }
        function validateUsername(v) {
            if (!v) return 'Username is required.';
            if (v.length < 3) return 'Username must be at least 3 characters.';
            if (!/^[a-zA-Z0-9._]+$/.test(v)) return 'Only letters, numbers, dots and underscores allowed.';
            return '';
        }
        function validateEmail(v) {
            if (!v) return 'Email is required.';
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) return 'Please enter a valid email address.';
            return '';
        }
        function validatePassword(v) {
            if (!v) return 'Password is required.';
            if (v.length < 8) return 'Password must be at least 8 characters.';
            if (!/[A-Z]/.test(v)) return 'Must contain at least one uppercase letter (A-Z).';
            if (!/[a-z]/.test(v)) return 'Must contain at least one lowercase letter (a-z).';
            if (!/\d/.test(v)) return 'Must contain at least one number (0-9).';
            if (!/[@$!%*?&#]/.test(v)) return 'Must contain at least one special character (@$!%*?&#).';
            return '';
        }

        function setFieldState(id, errMsg) {
            const input = document.getElementById(id);
            const parent = input.parentElement;
            const existing = parent.querySelector('.field-error, .field-success');
            if (existing) existing.remove();
            if (errMsg) {
                input.style.borderColor = '#ef4444';
                const err = document.createElement('div');
                err.className = 'field-error';
                err.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${errMsg}`;
                parent.appendChild(err);
            } else if (input.value) {
                input.style.borderColor = '#10b981';
                const ok = document.createElement('div');
                ok.className = 'field-success';
                ok.innerHTML = `<i class="fas fa-check-circle"></i> Looks good!`;
                parent.appendChild(ok);
            }
        }

        // ── Password strength bar ──
        function updatePasswordStrength(v) {
            let score = 0;
            if (v.length >= 8) score++;
            if (/[A-Z]/.test(v)) score++;
            if (/[a-z]/.test(v)) score++;
            if (/\d/.test(v)) score++;
            if (/[@$!%*?&#]/.test(v)) score++;
            const colors = ['#ef4444','#f59e0b','#f59e0b','#06b6d4','#10b981'];
            const labels = ['Very Weak','Weak','Fair','Good','Strong'];
            const pwdParent = document.getElementById('password').parentElement;
            let bar = document.getElementById('pwd-strength-bar');
            if (!bar) {
                bar = document.createElement('div');
                bar.id = 'pwd-strength-bar';
                bar.style = 'margin-top:6px;height:4px;background:#1e293b;border-radius:2px;overflow:hidden;';
                bar.innerHTML = '<div id="pwd-bar-fill" style="height:100%;border-radius:2px;transition:all 0.3s;width:0%"></div>';
                const hint = document.createElement('div');
                hint.id = 'pwd-hint';
                hint.style = 'font-size:11px;margin-top:4px;font-weight:600;';
                pwdParent.appendChild(bar);
                pwdParent.appendChild(hint);
            }
            if (v) {
                document.getElementById('pwd-bar-fill').style.width = (score * 20) + '%';
                document.getElementById('pwd-bar-fill').style.background = colors[score-1] || '#ef4444';
                document.getElementById('pwd-hint').style.color = colors[score-1] || '#ef4444';
                document.getElementById('pwd-hint').textContent = labels[score-1] || 'Very Weak';
            } else {
                document.getElementById('pwd-bar-fill').style.width = '0%';
                document.getElementById('pwd-hint').textContent = '';
            }
        }

        // ── Live validation listeners ──
        document.getElementById('full_name').addEventListener('blur', function() {
            setFieldState('full_name', validateFullName(this.value.trim()));
        });
        document.getElementById('username').addEventListener('blur', function() {
            setFieldState('username', validateUsername(this.value.trim()));
        });
        document.getElementById('email').addEventListener('blur', function() {
            setFieldState('email', validateEmail(this.value.trim()));
        });
        document.getElementById('password').addEventListener('input', function() {
            setFieldState('password', validatePassword(this.value));
            updatePasswordStrength(this.value);
        });

        // ── Form submit ──
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                full_name: document.getElementById('full_name').value.trim(),
                username: document.getElementById('username').value.trim(),
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value
            };
            // Validate all fields before anything
            const nameErr = validateFullName(data.full_name);
            const userErr = validateUsername(data.username);
            const emailErr = validateEmail(data.email);
            const pwdErr = validatePassword(data.password);
            setFieldState('full_name', nameErr);
            setFieldState('username', userErr);
            setFieldState('email', emailErr);
            setFieldState('password', pwdErr);
            if (nameErr || userErr || emailErr || pwdErr) {
                showError('Please fix the errors above before continuing.');
                return;
            }
            const loader = document.getElementById('loader');
            loader.classList.add('active');
            try {
                const checkRes = await fetch(API + '/api/auth/check-availability', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ username: data.username, email: data.email })
                });
                const checkResult = await checkRes.json();
                if (!checkRes.ok) {
                    showError(checkResult.detail || 'Username or email already exists.');
                    return;
                }
                const otpRes = await fetch(API + '/api/auth/send-otp', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email: data.email, purpose: 'verify' })
                });
                if (otpRes.ok) {
                    pendingData = data;
                    document.getElementById('otp-email-display').textContent = data.email;
                    goToStep(2);
                    setupOTPInputs();
                } else {
                    const otpResult = await otpRes.json();
                    showError(otpResult.detail || 'Failed to send verification code.');
                }
            } catch (err) {
                showError('Connection failed.');
            } finally {
                loader.classList.remove('active');
            }
        });

        async function verifyOTP() {
            const otp = Array.from(document.querySelectorAll('.otp-digit')).map(i => i.value).join('');
            if (otp.length < 6) { showError('Please enter the complete 6-digit code.'); return; }
            const loader = document.getElementById('loader');
            loader.classList.add('active');
            try {
                const res = await fetch(API + '/api/auth/verify-otp', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email: pendingData.email, otp: otp })
                });
                const result = await res.json();
                if (res.ok && result.verified) {
                    const regRes = await fetch(API + '/api/register', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(pendingData)
                    });
                    const regResult = await regRes.json();
                    if (regRes.ok) {
                        const loginForm = new FormData();
                        loginForm.append('username', pendingData.username);
                        loginForm.append('password', pendingData.password);
                        const loginRes = await fetch(API + '/api/auth/login', {
                            method: 'POST',
                            body: loginForm
                        });
                        const loginResult = await loginRes.json();
                        if (loginRes.ok) {
                            localStorage.setItem('authToken', loginResult.access_token);
                            localStorage.setItem('userInfo', JSON.stringify(loginResult.user));
                            localStorage.setItem('user', JSON.stringify(loginResult.user));
                            window.location.href = 'index.html';
                        } else {
                            window.location.href = 'login.html';
                        }
                    } else {
                        showError(regResult.detail || 'Registration failed.');
                    }
                } else {
                    showError(result.detail || 'Invalid OTP.');
                }
            } catch (err) {
                showError('Verification failed.');
            } finally {
                loader.classList.remove('active');
            }
        }

        async function resendOTP() {
            if (!pendingData) return;
            try {
                await fetch(API + '/api/auth/send-otp', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email: pendingData.email, purpose: 'verify' })
                });
                showSuccess('New code sent to your email.');
            } catch(e) { showError('Failed to resend.'); }
        }

        function setupOTPInputs() {
            const inputs = document.querySelectorAll('.otp-digit');
            inputs.forEach((input, i) => {
                input.value = '';
                input.addEventListener('input', () => {
                    if (input.value && i < inputs.length - 1) inputs[i+1].focus();
                    const otp = Array.from(inputs).map(x => x.value).join('');
                    if (otp.length === 6) verifyOTP();
                });
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !input.value && i > 0) inputs[i-1].focus();
                    if (e.key === 'Enter') verifyOTP();
                });
            });
            inputs[0].focus();
        }
    </script>
</body>
</html>
