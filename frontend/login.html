<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CyberGuard GRC Platform</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .login-container{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f172a,#1e293b);position:relative;overflow:hidden;}
        .login-container::before{content:'';position:absolute;width:500px;height:500px;background:radial-gradient(circle,rgba(6,182,212,0.1),transparent 70%);top:-100px;right:-100px;}
        .login-container::after{content:'';position:absolute;width:400px;height:400px;background:radial-gradient(circle,rgba(139,92,246,0.1),transparent 70%);bottom:-100px;left:-100px;}
        .login-card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:16px;padding:48px;width:100%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,0.3);position:relative;z-index:1;}
        .login-logo{width:64px;height:64px;background:linear-gradient(135deg,var(--accent-primary),var(--accent-secondary));border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;box-shadow:0 8px 24px rgba(6,182,212,0.3);}
        .error-box{background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.3);color:#ef4444;padding:12px 16px;border-radius:8px;margin-bottom:20px;font-size:13px;display:none;}
        .error-box.show{display:block;}
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div style="text-align:center;margin-bottom:32px;">
                <div class="login-logo"><i class="fas fa-shield-halved" style="font-size:28px;color:white;"></i></div>
                <h1 style="font-size:26px;font-weight:700;margin-bottom:6px;">Welcome Back</h1>
                <p style="font-size:14px;color:var(--text-muted);">Sign in to CyberGuard GRC Platform</p>
            </div>
            <div id="error-box" class="error-box"></div>
            <form id="login-form">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" id="username" class="form-input" placeholder="Enter your username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
                </div>
                <div class="form-group" style="margin-bottom:28px;">
                    <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
                        <input type="checkbox" id="remember-me" style="accent-color:var(--accent-primary);">
                        <span style="font-size:13px;color:var(--text-secondary);">Remember me</span>
                    </label>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;padding:14px;font-size:15px;">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
            </form>
            <div style="text-align:center;margin-top:24px;font-size:13px;color:var(--text-muted);">
                Don't have an account? <a href="register.html" style="color:var(--accent-primary);text-decoration:none;font-weight:600;">Create Account</a>
            </div>
        </div>
    </div>
    <div id="loader" class="loader"><div class="spinner"></div></div>
    <script>
        // Redirect if already logged in
        if (localStorage.getItem('authToken')) window.location.href = 'index.html';

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errBox = document.getElementById('error-box');
            const loader = document.getElementById('loader');
            errBox.classList.remove('show');
            loader.classList.add('active');

            const formData = new FormData();
            formData.append('username', document.getElementById('username').value.trim());
            formData.append('password', document.getElementById('password').value);

            try {
                const res = await fetch('https://gradproject2026.onrender.com/api/auth/login', { method: 'POST', body: formData });
                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem('authToken', data.access_token);
                    localStorage.setItem('userInfo', JSON.stringify(data.user));
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = 'index.html';
                } else {
                    const err = await res.json();
                    errBox.textContent = err.detail || 'Invalid credentials. Please try again.';
                    errBox.classList.add('show');
                }
            } catch (e) {
                errBox.textContent = 'Connection failed. Ensure the server is running.';
                errBox.classList.add('show');
            } finally {
                loader.classList.remove('active');
            }
        });
    </script>
</body>
</html>
