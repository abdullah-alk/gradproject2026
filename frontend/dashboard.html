<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberGuard Dashboard</title>

<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

/* ================= GLOW SYSTEM ================= */

.card {
    transition: 0.3s ease;
    border: 1px solid transparent;
}

.card:hover {
    transform: translateY(-6px);
    border: 1px solid rgba(6,182,212,0.6);
    box-shadow: 0 0 25px rgba(6,182,212,0.25);
}

/* Section Titles */
.section-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
    margin: 20px 0 10px;
    color: #06b6d4;
}

/* Chart Containers Glow */
.chart-container {
    transition: 0.3s;
}

.chart-container:hover {
    box-shadow: 0 0 30px rgba(99,102,241,0.2);
    border-radius: 12px;
}

/* Icons */
.icon {
    color: #06b6d4;
}

/* Progress bar glow */
#audit-progress-bar {
    transition: 0.5s;
}

#audit-progress-bar:hover {
    box-shadow: 0 0 10px #06b6d4;
}

</style>

</head>

<body>

<div class="app-container">

<!-- Sidebar -->
<aside class="sidebar">
    <div class="sidebar-header">
        <div class="logo-icon"><i class="fas fa-shield-halved"></i></div>
        <h2>CyberGuard</h2>
    </div>

    <nav class="sidebar-nav">
        <a href="index.html"><i class="fas fa-home"></i> Home</a>
        <a href="dashboard.html" class="active"><i class="fas fa-chart-line"></i> Dashboard</a>
        <a href="evidence.html"><i class="fas fa-folder"></i> Evidence</a>
        <a href="chatbot.html"><i class="fas fa-robot"></i> ECC AI</a>
    </nav>
</aside>

<!-- MAIN -->
<main class="main-content">
<div class="content-wrapper">

<h1><i class="fas fa-shield-alt icon"></i> Compliance Dashboard</h1>

<!-- STATS -->
<div class="grid">

<div class="card">
    <i class="fas fa-chart-pie icon"></i>
    <h3>Overall Score</h3>
    <h2 id="overall-compliance-score">0%</h2>
</div>

<div class="card">
    <i class="fas fa-triangle-exclamation icon"></i>
    <h3>Total Gaps</h3>
    <h2 id="total-gaps-count">0</h2>
</div>

<div class="card">
    <i class="fas fa-tasks icon"></i>
    <h3>Audit Progress</h3>
    <h2 id="audit-progress-percentage">0%</h2>
</div>

<div class="card">
    <i class="fas fa-calendar icon"></i>
    <h3>Next Audit</h3>
    <h2 id="next-audit-days">—</h2>
</div>

</div>

---

<!-- ECC DOMAINS MATURITY -->
<div class="section-title">
<i class="fas fa-brain"></i> ECC Domains Maturity
</div>

<div class="card chart-container">
<canvas id="domainsRadarChart"></canvas>
</div>

---

<!-- COMPLIANCE BY DOMAIN -->
<div class="section-title">
<i class="fas fa-chart-bar"></i> Compliance by Domain
</div>

<div class="card chart-container">
<canvas id="categoryBarChart"></canvas>
</div>

</div>
</main>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="js/api.js"></script>
<script src="js/dashboard.js"></script>

</body>
</html>
