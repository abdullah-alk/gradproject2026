<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - CyberGuard</title>

<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

.card {
    background: rgba(15,23,42,0.7);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 14px;
    padding: 20px;
    position: relative;
    transition: all 0.3s ease;
}

.card:hover {
    transform: translateY(-6px) scale(1.01);
    box-shadow: 0 0 30px rgba(6,182,212,0.25);
    border-color: #06b6d4;
}

.card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 14px;
    opacity: 0;
    background: radial-gradient(circle at center, rgba(6,182,212,0.25), transparent 70%);
    transition: 0.3s;
}

.card:hover::before {
    opacity: 1;
}

.card-icon {
    font-size: 20px;
    color: #06b6d4;
    margin-bottom: 10px;
}

</style>

</head>

<body>

<div class="app-container">

<main class="main-content">

<h1>Compliance Dashboard</h1>

<div class="grid">

<div class="card">
<i class="fas fa-chart-line card-icon"></i>
<h3>Overall Compliance</h3>
<h2 id="overall-compliance-score">0%</h2>
</div>

<div class="card">
<i class="fas fa-bug card-icon"></i>
<h3>Total Gaps</h3>
<h2 id="total-gaps-count">0</h2>
</div>

<div class="card">
<i class="fas fa-tasks card-icon"></i>
<h3>Audit Progress</h3>
<h2 id="audit-progress-percentage">0%</h2>
<div style="background:#1e293b;height:6px;border-radius:6px">
<div id="audit-progress-bar" style="height:6px;background:#06b6d4;width:0%"></div>
</div>
</div>

<div class="card">
<i class="fas fa-calendar card-icon"></i>
<h3>Next Audit</h3>
<h2 id="next-audit-days">—</h2>
<p id="next-audit-date"></p>
</div>

</div>

<br>

<div class="grid">

<div class="card" style="height:350px">
<h3>ECC Domains Maturity</h3>
<canvas id="domainsRadarChart"></canvas>
</div>

<div class="card" style="height:350px">
<h3>Compliance by Domain</h3>
<canvas id="categoryBarChart"></canvas>
</div>

</div>

</main>

</div>

<script src="js/api.js"></script>
<script src="js/dashboard.js"></script>

</body>
</html>
